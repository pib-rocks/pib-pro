# IEEE-1588 PTP grandmaster profile (template for Thor host)
[global]
clockClass              6
clockAccuracy           0x21
priority1               128
priority2               128
domainNumber            24
twoStepFlag             1
delay_mechanism         E2E
network_transport       UDPv4
time_stamping           hardware

[${DEFAULT_IFACE}]
masterOnly              1
